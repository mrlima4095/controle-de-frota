services:
  web:
    build: .
    ports:
      - "8090:8080"
    environment:
      DB_HOST: db
      DB_NAME: controle_de_frota
      DB_USER: controle
      DB_PASSWORD: controle123
    depends_on:
      - db
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frota-http.entryPoints=http"
      - "traefik.http.routers.frota-http.middlewares=frota-redirect-https"
      - "traefik.http.routers.frota-http.rule=Host(`frota.opentty.fun`)"
      - "traefik.http.routers.frota-http.service=frota-svc"
      - "traefik.http.middlewares.frota-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.routers.frota-https.entryPoints=https"
      - "traefik.http.routers.frota-https.rule=Host(`frota.opentty.fun`)"
      - "traefik.http.routers.frota-https.service=frota-svc"
      - "traefik.http.routers.frota-https.tls=true"
      - "traefik.http.routers.frota-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.frota-svc.loadbalancer.server.port=8080"

  db:
    build:
      context: ./database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: controle_de_frota
      MYSQL_USER: controle
      MYSQL_PASSWORD: controle123
    volumes:
      - db_data:/var/lib/mysql
      # O script database/controle.sql deve ser importado manualmente
      # (ver README), para evitar problemas de montagem no Coolify.

volumes:
  db_data:

networks:
  default:
  coolify:
    external: true
